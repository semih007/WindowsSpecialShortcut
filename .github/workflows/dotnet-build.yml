name: .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore SmartShortcutManager/SmartShortcutManager.csproj
      - name: Build
        run: dotnet build SmartShortcutManager/SmartShortcutManager.csproj --configuration Release --no-restore
      - name: Run unit tests (if any)
        run: |
          echo "No unit tests configured in initial seed, skipping."
